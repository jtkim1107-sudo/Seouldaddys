<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>색상</title>
<style>
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background:#faf8f5; margin:0; padding:24px; color:#292524; }
  h2 { font-size:14px; margin:0 0 12px; color:#78716c; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .sw { width:96px; border-radius:12px; overflow:hidden; border:1px solid rgba(0,0,0,.06); background:#fff; }
  .chip { height:56px; }
  .meta { padding:8px 10px; font-size:11px; line-height:1.5; }
  .meta b { display:block; font-size:12px; }
</style>
</head>
<body>
  <h2>브랜드 (오렌지)</h2>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#fff4ec"></div><div class="meta"><b>brand-50</b>#fff4ec</div></div>
    <div class="sw"><div class="chip" style="background:#ffe6d5"></div><div class="meta"><b>brand-100</b>#ffe6d5</div></div>
    <div class="sw"><div class="chip" style="background:#f4691f"></div><div class="meta"><b>brand-500</b>#f4691f</div></div>
    <div class="sw"><div class="chip" style="background:#e05a12"></div><div class="meta"><b>brand-600</b>#e05a12</div></div>
    <div class="sw"><div class="chip" style="background:#b8490f"></div><div class="meta"><b>brand-700</b>#b8490f</div></div>
  </div>
  <h2>바탕 · 글자</h2>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#faf8f5"></div><div class="meta"><b>배경</b>#faf8f5</div></div>
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="meta"><b>카드</b>#ffffff</div></div>
    <div class="sw"><div class="chip" style="background:#292524"></div><div class="meta"><b>본문 글자</b>#292524</div></div>
    <div class="sw"><div class="chip" style="background:#78716c"></div><div class="meta"><b>보조 글자</b>#78716c</div></div>
    <div class="sw"><div class="chip" style="background:#151210"></div><div class="meta"><b>사이드바</b>#151210</div></div>
  </div>
  <h2>상태</h2>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#f59e0b"></div><div class="meta"><b>진행 중</b>#f59e0b</div></div>
    <div class="sw"><div class="chip" style="background:#22c55e"></div><div class="meta"><b>완료</b>#22c55e</div></div>
    <div class="sw"><div class="chip" style="background:#ef4444"></div><div class="meta"><b>경고·삭제</b>#ef4444</div></div>
  </div>
</body>
</html>
